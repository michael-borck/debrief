version: 2
updates:
  # Keep the SHA-pinned GitHub Actions current. Dependabot bumps both the
  # commit SHA and the trailing `# vN` comment when upstream releases.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci

  # npm deps. Grouped so routine patch/minor bumps land as one PR instead of
  # a flood; majors (e.g. electron) come through individually for review.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
