name: CI

# Fast sanity gate on every push: typecheck, production build, and the test
# suite. Separate from release.yml (which only runs on version tags) so that a
# broken build or red test is caught immediately, not at release time. This
# exists because a corrupted install once shipped a main branch whose
# `npm run build` did not compile and nothing flagged it.

on:
  push:
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # Node 22: the db-rpc tests use the built-in node:sqlite module, which
          # only exists in Node 22.5+. Node 20 throws "No such built-in module:
          # node:sqlite" and fails the whole suite.
          node-version: 22
          cache: npm

      # --ignore-scripts skips the postinstall native rebuild
      # (electron-builder install-app-deps). Neither the webpack build nor the
      # vitest suite (which uses node:sqlite, not better-sqlite3) needs native
      # modules, so this keeps the gate fast and avoids flaky Electron
      # downloads. Also fails fast if package-lock.json drifts from package.json.
      - name: Install deps
        run: npm ci --ignore-scripts

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Production build
        run: npm run build

      - name: Tests
        run: npx vitest run
