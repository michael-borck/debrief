name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false  # one platform failing must not cancel the others
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Enable long paths (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # HuggingFace model caches use deeply nested paths
          # (models--org--name/snapshots/<40-char-hash>/<long-filename>) that
          # routinely exceed Windows' 260-char default. Both git and the
          # NTFS filesystem need long-paths enabled for the build to
          # complete the 7zip archive step.
          git config --system core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Force
          Write-Host "Long paths enabled."

      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # ubuntu-latest only has ~14 GB free. PyTorch wheels + venv
          # builds + electron-builder cache routinely push past that.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h

      - name: Install Node deps
        run: npm ci

      - name: Bundle relocatable Python + prefetch model weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash  # ensures git-bash on Windows runners
        run: npm run build:sidecar

      - name: Build webpack bundle
        run: npm run build

      - name: Import macOS signing certificate
        if: matrix.os == 'macos-14'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          echo "$MACOS_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$MACOS_CERTIFICATE_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-14'
        env:
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          # Renamed from APPLE_* so electron-builder doesn't auto-fire its
          # own (buggy) notarize wrapper alongside our scripts/notarize.js
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --publish=never

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish=never

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish=never

      - name: Upload distributables
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-distributables
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/latest*.yml
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Debrief $TAG" \
            --notes "Debrief $TAG — multi-platform build. See CHANGELOG for details." \
            --draft || true
          find release-artifacts -type f \( \
            -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" \
            -o -name "*.deb" -o -name "*.exe" -o -name "latest*.yml" \
          \) -exec gh release upload "$TAG" {} --clobber \;
          gh release edit "$TAG" --draft=false --latest
