name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Gate the release on known CVEs in production npm deps and the runtime
  # pip install specs (what setup-venv.py will pip-install on the user's
  # machine). Fails the build for any High/Critical npm vuln in the prod
  # tree, or any pip-audit finding. Detection-only — doesn't prevent
  # zero-day attacks, but catches anything publicly disclosed by build
  # time. Costs ~5 min per release.
  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: No generic db-query passthrough (Tier 0.6 / C-SEC-3)
        run: |
          # The arbitrary-SQL db-query IPC was removed in Tier 0.6; every DB
          # access goes through a validated per-domain RPC. Fail the release
          # if either canary call shape reappears. Doc comments may mention
          # "db-query" in prose, so we match the precise call shapes only.
          if grep -rnE "electronAPI\.database\b|ipcMain\.handle\(\s*['\"]db-query['\"]" \
               --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src public; then
            echo "::error::Generic db-query passthrough reintroduced — use a per-domain db.* RPC instead."
            exit 1
          fi

      - name: npm audit (production deps only, high+)
        run: |
          npm ci --ignore-scripts
          npm audit --omit=dev --audit-level=high

      - name: pip-audit (runtime install specs)
        run: |
          # Match what setup-venv.py installs at runtime so users + CI
          # are looking at the same dependency graph. Keep this list in
          # sync with INSTALL_SPECS in embedded-server/setup-venv.py.
          python -m venv /tmp/audit-venv
          /tmp/audit-venv/bin/pip install --quiet --upgrade pip
          /tmp/audit-venv/bin/pip install --quiet \
            'speech-analyser[diarization]>=0.2.0' \
            'sentence-transformers>=2.7,<6'
          /tmp/audit-venv/bin/pip install --quiet pip-audit
          # CVE-2025-3000 (torch, no fixed release as of Jun 2026): local-only
          # memory-corruption crash in torch.jit.script with list attributes,
          # CVSS 5.3. The sidecar never calls torch.jit.script (torch is used
          # for whisper/pyannote inference only) and exploitation requires
          # already-running local Python. Waived so the gate doesn't block
          # every release; drop the ignore once torch ships a fixed version.
          /tmp/audit-venv/bin/pip-audit --strict --ignore-vuln CVE-2025-3000

  build:
    needs: security-audit
    strategy:
      fail-fast: false  # one platform failing must not cancel the others
      matrix:
        include:
          - os: macos-14
            platform: mac
            arch: arm64
          - os: ubuntu-latest
            platform: linux
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 20

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.13'

      - name: Enable long paths (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # HuggingFace model caches use deeply nested paths
          # (models--org--name/snapshots/<40-char-hash>/<long-filename>) that
          # routinely exceed Windows' 260-char default. Both git and the
          # NTFS filesystem need long-paths enabled for the build to
          # complete the 7zip archive step.
          git config --system core.longpaths true
          Set-ItemProperty -Path "HKLM:\SYSTEM\CurrentControlSet\Control\FileSystem" -Name "LongPathsEnabled" -Value 1 -Force
          Write-Host "Long paths enabled."

      - name: Free disk space (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          # ubuntu-latest only has ~14 GB free. PyTorch wheels + venv
          # builds + electron-builder cache routinely push past that.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          docker system prune -af --volumes || true
          df -h

      - name: Install Node deps
        run: npm ci

      - name: Bundle relocatable Python + prefetch model weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        shell: bash  # ensures git-bash on Windows runners
        run: npm run build:sidecar

      - name: Build webpack bundle
        run: npm run build

      - name: Import macOS signing certificate
        if: matrix.os == 'macos-14'
        env:
          CERT_B64: ${{ secrets.CSC_LINK }}
          CERT_PWD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CERT_B64" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 -k build.keychain -P "$CERT_PWD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k actions build.keychain
          rm certificate.p12

      - name: Build Electron app (macOS)
        if: matrix.os == 'macos-14'
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # Renamed from APPLE_* so electron-builder doesn't auto-fire its
          # own (buggy) notarize wrapper alongside our scripts/notarize.js
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_APPLE_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --publish=never

      - name: Build Electron app (Linux)
        if: matrix.os == 'ubuntu-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --linux --x64 --publish=never

      - name: Build Electron app (Windows)
        if: matrix.os == 'windows-latest'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --x64 --publish=never

      - name: Upload distributables
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.platform }}-${{ matrix.arch }}-distributables
          path: |
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/latest*.yml
          if-no-files-found: warn

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release-artifacts

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "Debrief $TAG" \
            --notes "Debrief $TAG — multi-platform build. See CHANGELOG for details." \
            --draft || true
          find release-artifacts -type f \( \
            -name "*.dmg" -o -name "*.zip" -o -name "*.AppImage" \
            -o -name "*.deb" -o -name "*.exe" -o -name "latest*.yml" \
          \) -exec gh release upload "$TAG" {} --clobber \;
          gh release edit "$TAG" --draft=false --latest
