name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos-arm64:
    # macos-14 = Apple Silicon (arm64). bundle-python.sh currently only ships
    # an arm64 python-build-standalone tarball; add x64/win/linux jobs once
    # the script grows multi-arch support.
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Node deps
        run: npm ci

      - name: Bundle relocatable Python + prefetch pyannote/whisper weights
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: npm run build:sidecar

      - name: Build webpack bundle
        run: npm run build

      - name: Build, sign and notarize the .app
        env:
          # electron-builder picks up CSC_LINK + CSC_KEY_PASSWORD automatically.
          CSC_LINK: ${{ secrets.MACOS_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
          # Our scripts/notarize.js reads these. Renamed from APPLE_* on purpose
          # so electron-builder doesn't run its own (buggy) notarize wrapper.
          NOTARIZE_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARIZE_APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          NOTARIZE_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --mac --arm64 --publish=never

      - name: Upload .dmg + .zip artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64-distributables
          path: |
            release/*.dmg
            release/*.zip
            release/latest-mac.yml

  release:
    needs: build-macos-arm64
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create / update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" \
            --title "DeepDebrief $TAG" \
            --notes "DeepDebrief $TAG — macOS arm64 build. See CHANGELOG for details." \
            --draft || true
          find release-artifacts -type f \( -name "*.dmg" -o -name "*.zip" -o -name "latest-mac.yml" \) \
            -exec gh release upload "$TAG" {} --clobber \;
          gh release edit "$TAG" --draft=false --latest
